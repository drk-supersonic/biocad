services:
  - type: web
    name: gantt-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_MODEL
        value: google/gemini-3-flash-preview
      - key: CORS_ORIGINS
        value: https://gantt-frontend-8j8e.onrender.com
    # Ключ OpenRouter НЕ хранится тут — пользователь вводит его в интерфейсе,
    # он приходит в теле запроса на /api/chat и нигде на сервере не сохраняется.

  - type: web
    name: gantt-frontend
    runtime: static
    rootDir: frontend
    # Render для Node.js сам, отдельным шагом, ДО buildCommand гоняет свой
    # неявный "npm install" с кэшем node_modules между деплоями
    # (NODE_MODULES_CACHE=true по умолчанию). Именно на этом шаге падал
    # patch-package — он накладывал новый патч поверх старого закэшированного
    # node_modules, ещё до того как доходило до нашего buildCommand.
    # SKIP_INSTALL_DEPS=true отключает этот неявный шаг Render целиком —
    # установку зависимостей полностью делает наш buildCommand (npm ci
    # каждый раз переустанавливает всё с нуля по lock-файлу, гарантированно
    # без остатков старого патча).
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://gantt-backend-zaw6.onrender.com
      - key: SKIP_INSTALL_DEPS
        value: "true"
