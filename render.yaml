services:
  - type: web
    name: gantt-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_MODEL
        value: google/gemini-3-flash-preview
      - key: CORS_ORIGINS
        value: https://gantt-frontend-8j8e.onrender.com
    # Ключ OpenRouter НЕ хранится тут — пользователь вводит его в интерфейсе,
    # он приходит в теле запроса на /api/chat и нигде на сервере не сохраняется.

  - type: web
    name: gantt-frontend
    runtime: static
    rootDir: frontend
    # npm ci (а не npm install) — всегда переустанавливает node_modules с нуля
    # по package-lock.json. Render кэширует node_modules между деплоями, и с
    # npm install пакет gantt-task-react (версия в package.json не менялась)
    # не переустанавливался, а patch-package пытался наложить новый патч на
    # уже пропатченные старой версией файлы — и падал с ошибкой.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://gantt-backend-zaw6.onrender.com
